services:
  db:
    image: postgres:16-alpine
    container_name: campusconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusconnect
      POSTGRES_USER: campusconnect
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_only_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - campusconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusconnect -d campusconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: campusconnect-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  campusconnect_pgdata:
